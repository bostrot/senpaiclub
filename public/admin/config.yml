# GitHub is the repo that deploys (the GitLab project is a stale copy).
# Sign in with a fine-grained personal access token (Contents: read/write on this repo),
# or set up sveltia-cms-auth on Cloudflare Workers and add `base_url` for one-click OAuth.
backend:
  name: github
  repo: bostrot/senpaiclub
  branch: main
site_url: https://senpai.club
display_url: https://senpai.club
logo_url: https://senpai.club/assets/img/seal.png
media_folder: "public/assets/uploads"
public_folder: "/assets/uploads"
output:
  omit_empty_optional_fields: true
collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/posts/"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "{{slug}}/"
    summary: "{{title}} — {{date | date('YYYY-MM-DD')}}"
    sortable_fields: [date, title]
    editor:
      preview: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Author", name: "author", widget: "select", options: ["eric", "max"], default: "eric" }
      - { label: "Description", name: "description", widget: "string", required: false, hint: "Shown on cards, in search results and social previews (~160 chars)." }
      - { label: "Category", name: "categories", widget: "select", multiple: true, options: [{ label: "Guide", value: "wiki" }, { label: "Tutorial", value: "tutorial" }, { label: "Blog", value: "blog" }], default: ["wiki"] }
      - { label: "Tags", name: "tags", widget: "list", required: false, hint: "Comma-separated, lowercase, e.g. proxmox, windows" }
      - { label: "Cover image", name: "image", widget: "image", required: false, hint: "Optional. Without one, a kanji cover is generated automatically." }
      - { label: "Kanji", name: "kanji", widget: "string", required: false, pattern: ["^.{1,2}$", "One or two characters"], hint: "Override the auto-picked cover kanji." }
      - { label: "Featured on home", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "Body", name: "body", widget: "markdown" }
