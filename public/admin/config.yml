backend:
  name: gitlab
  repo: bostrot/senpaiclub
  branch: main
  auth_type: pkce
  app_id: 16c44dec105f6f32e8f87d0368bc4c4d6b0b1d7c4366518feec18ae57c3b45f3
media_folder: "public/assets/uploads"
public_folder: "/assets/uploads"
collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/posts/"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "{{slug}}/"
    editor:
      preview: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Author", name: "author", widget: "select", options: ["eric", "max"], default: "eric" }
      - { label: "Description", name: "description", widget: "string", required: false, hint: "Shown on cards, in search results and social previews (~160 chars)." }
      - { label: "Categories", name: "categories", widget: "list", default: ["wiki"], hint: "wiki = guide, tutorial, blog" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Cover image", name: "image", widget: "image", required: false }
      - { label: "Featured on home", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "Body", name: "body", widget: "markdown" }
